name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate themes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build themes
        run: npm run build

      - name: Check generated themes match source
        run: git diff --exit-code -- themes/

      - name: Validate theme colors
        run: npm test

  package:
    name: Package extension
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - run: npm ci

      - name: Build themes
        run: npm run build

      - name: Package .vsix
        run: npx @vscode/vsce package --no-dependencies -o aether-themes.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-themes-vsix
          path: aether-themes.vsix
          if-no-files-found: error
